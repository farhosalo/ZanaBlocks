name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  QT_VERSION: "6.8.3"
  BUILD_TYPE: Release

# ─────────────────────────────────────────────────────────────
# Linux
# ─────────────────────────────────────────────────────────────
jobs:
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libserialport-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/
          retention-days: 7

# ─────────────────────────────────────────────────────────────
# macOS
# ─────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install \
            cmake ninja \
            protobuf \
            libserialport \
            clang-format \
            llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/
          retention-days: 7

# ─────────────────────────────────────────────────────────────
# Windows — uses MSYS2/MinGW64 so all three libs are available
# via pacman without manual source builds.
# ─────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (MinGW64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          pacboy: >-
            cmake:p
            ninja:p
            protobuf:p
            libserialport:p
            qt6-base:p
            cc:p
            clang-tools-extra:p

      - name: Generate libserialport cmake config
        run: |
          MINGW_ROOT=$(cygpath -m /mingw64)
          mkdir -p /mingw64/lib/cmake/libserialport
          cat > /mingw64/lib/cmake/libserialport/libserialportConfig.cmake << EOF
          add_library(libserialport::libserialport SHARED IMPORTED)
          set_target_properties(libserialport::libserialport PROPERTIES
            IMPORTED_LOCATION   "${MINGW_ROOT}/bin/libserialport-0.dll"
            IMPORTED_IMPLIB     "${MINGW_ROOT}/lib/libserialport.dll.a"
            INTERFACE_INCLUDE_DIRECTORIES "${MINGW_ROOT}/include"
          )
          EOF

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/
          retention-days: 7